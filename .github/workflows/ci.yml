name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint + tests only — the production build is gated by Vercel on every deploy,
# and `next build` here would need the runtime env (Supabase etc.).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # not `npm test`: its `tests/**/*.test.ts` glob relies on zsh globstar
      # expansion and comes through literally under the runner's bash
      - run: npx tsx --test tests/*.test.ts
